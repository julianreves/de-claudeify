<!doctype html>
<meta charset="utf-8">
<title>bottle renders</title>
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// A small photo studio as the reflection environment: long strip softboxes and a top light on a dark room.
function studio() {
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0x0b0b0c);
  const light = (w, h, x, y, z, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 1.5, 0); sc.add(m);
  };
  light(0.9, 9, -5, 2, 2.5, 7);     // key strip, left
  light(0.6, 9, 5.5, 2, 1.5, 4);    // fill strip, right
  light(0.5, 9, 0, 2, -6, 9);       // rim strip, behind
  light(7, 7, 0, 8, 1, 3.2);        // top
  light(5, 1.2, 0, 0.3, 6, 0.9);    // soft front, low
  return sc;
}
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(studio(), 0.02).texture;

function labelTexture(cfg) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 900;
  const g = c.getContext('2d');
  g.fillStyle = cfg.paper; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = cfg.ink; g.textAlign = 'center';
  g.font = '700 44px Arial'; g.fillText('BODEGA PARCELA', 512, 110);
  g.fillStyle = cfg.accent; g.font = '700 470px Arial'; g.fillText('41', 512, 570);
  g.fillStyle = cfg.ink; g.font = '700 74px Arial'; g.fillText(cfg.name, 512, 700);
  g.font = '400 36px Arial'; g.fillText(cfg.year + '   RIBERA DEL DUERO', 512, 770);
  g.font = '400 28px Arial'; g.fillText('750 ML   14% VOL', 512, 835);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

function contactShadow(radius, opacity) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, `rgba(0,0,0,${opacity})`); gr.addColorStop(0.45, `rgba(0,0,0,${opacity * 0.55})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(radius * 2, radius * 2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.002; return m;
}

function bottle(cfg) {
  const grp = new THREE.Group();
  const prof = [[0,0.0],[0.33,0.0],[0.385,0.04],[0.40,0.12],[0.40,1.85],[0.392,2.02],[0.35,2.20],[0.27,2.42],[0.2,2.62],[0.17,2.78],[0.165,3.30],[0.19,3.33],[0.19,3.43],[0.165,3.45],[0,3.45]].map(([r,y]) => new THREE.Vector2(r, y));
  const glass = new THREE.MeshPhysicalMaterial({ color: 0x0a1a10, roughness: 0.04, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6, ior: 1.52, specularIntensity: 1 });
  grp.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 160), glass));
  const cap = [[0.17,2.78],[0.176,2.84],[0.176,3.30],[0.197,3.335],[0.197,3.445],[0.166,3.462],[0,3.462]].map(([r,y]) => new THREE.Vector2(r + 0.004, y));
  grp.add(new THREE.Mesh(new THREE.LatheGeometry(cap, 128), new THREE.MeshPhysicalMaterial({ color: cfg.foil, roughness: 0.32, metalness: 0.7, clearcoat: 0.5, clearcoatRoughness: 0.25, envMapIntensity: 1.3 })));
  const lab = new THREE.Mesh(new THREE.CylinderGeometry(0.406, 0.406, 0.98, 128, 1, true, -Math.PI * 0.6, Math.PI * 1.2),
    (() => { const t = labelTexture(cfg); return new THREE.MeshPhysicalMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.62, roughness: 0.75, metalness: 0, clearcoat: 0.1, clearcoatRoughness: 0.5, envMapIntensity: 0.4 }); })());
  lab.position.y = 1.0; grp.add(lab);
  return grp;
}

const CFG = {
  joven:   { name: 'JOVEN',   year: '2023', paper: '#ffffff', ink: '#111318', accent: '#d62718', foil: 0xd62718 },
  crianza: { name: 'CRIANZA', year: '2021', paper: '#d62718', ink: '#ffffff', accent: '#ffffff', foil: 0x151515 },
  reserva: { name: 'RESERVA', year: '2019', paper: '#111111', ink: '#ffffff', accent: '#d62718', foil: 0xd62718 },
};

function shoot(names, W, H, fov, camZ, spread, lookY) {
  renderer.setSize(W, H);
  const scene = new THREE.Scene(); scene.environment = env;
  const n = names.length;
  names.forEach((nm, i) => {
    const off = (i - (n - 1) / 2);
    const b = bottle(CFG[nm]); b.position.x = off * spread; b.rotation.y = off * -0.32; scene.add(b);
    const sh = contactShadow(0.95, 0.5); sh.position.x = off * spread; scene.add(sh);
  });
  const cam = new THREE.PerspectiveCamera(fov, W / H, 0.1, 80);
  cam.position.set(0, lookY + 0.15, camZ); cam.lookAt(0, lookY, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
}

const out = {};
out.joven = shoot(['joven'], 700, 1500, 14, 17.2, 0, 1.74);
out.crianza = shoot(['crianza'], 700, 1500, 14, 17.2, 0, 1.74);
out.reserva = shoot(['reserva'], 700, 1500, 14, 17.2, 0, 1.74);
out.trio = shoot(['joven', 'crianza', 'reserva'], 1800, 1500, 14, 20, 1.5, 1.74);
for (const [k, v] of Object.entries(out)) { const p = document.createElement('pre'); p.id = 'img-' + k; p.textContent = v; document.body.appendChild(p); }
document.title = 'done';
</script>
